packages:
  - playground
  - test/fixtures/*
  - '!test/fixtures/shared'
  # Nuxt 3 itself depends on deprecated unplugin-vue-router; the Nuxt 3 fixture is installed on its
  # own (see test/fixtures/nuxt3/README.md) so this lockfile only contains what the project controls.
  - '!test/fixtures/nuxt3'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - sass@1.105.0
overrides:
  # archiver-utils (via nitropack) still asks for deprecated glob@10; glob@13 keeps the same CJS `sync` API.
  glob: ^13.0.6
