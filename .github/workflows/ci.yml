name: ci

on:
  push:
    branches: [main, develop, v2]
  pull_request:
    branches: [main, develop, v2]
  # Reused by release.yml as the gate before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm audit:deps
      - run: pnpm build
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nuxt: ['3', '4']
    env:
      VE_NUXT_MAJOR: ${{ matrix.nuxt }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm build
      # The Nuxt 3 fixture is its own workspace and consumes the freshly built package via file:.
      - if: matrix.nuxt == '3'
        run: pnpm test:fixtures:nuxt3
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-node${{ matrix.node }}-nuxt${{ matrix.nuxt }}
          path: coverage-e2e/
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:smoke
